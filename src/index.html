<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Restaurante del Parque - Pedidos</title>
    
    <!-- PWA Web App Meta Tags -->
    <meta name="theme-color" content="#052d4b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Tailwind CSS CDN -->
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    

    <link rel="stylesheet" href="css/app.css">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="img/icon-192.png">
</head>

<body class="h-full w-full bg-cream-light font-sans antialiased text-navy select-none flex flex-col justify-between overflow-hidden">

    <header class="w-full px-5 pb-2 flex justify-between items-center z-20 gap-2" style="padding-top:max(1.25rem,env(safe-area-inset-top))">
        <div class="glass-badge px-3.5 py-1.5 rounded-full flex items-center space-x-2 shadow-sm">
            <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="statusTxt" class="text-xs font-semibold text-navy tracking-wide whitespace-nowrap">Abierto • Parque Central</span>
        </div>

        <button id="pwaInstallBtn" onclick="triggerPWAInstall()" class="hidden bg-navy text-cream-light text-xs font-bold px-3 py-1.5 rounded-full shadow-md hover:bg-navy-light transition-all flex items-center space-x-1.5">
            <i class="fa-solid fa-download text-rust-light"></i>
            <span>Instalar App</span>
        </button>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center px-4 relative z-10 my-auto">
        
        <!-- Subtle background glow -->
        <div class="absolute w-72 h-72 rounded-full bg-rust/10 blur-3xl -z-10 pointer-events-none"></div>

        <!-- MAIN INTERACTIVE BUTTON CONTAINING YOUR UNTOUCHED IMAGE -->
        <button onclick="enterRestaurant()" class="focus:outline-none group flex flex-col items-center cursor-pointer transition-transform duration-300 transform active:scale-95">
            
            <!-- Direct Image Tag using exact uploaded logo -->
            <div style="perspective:800px"><div class="spin-logo"><img 
                src="img/logo.png" 
                alt="Restaurante del Parque" 
                class="object-contain drop-shadow-2xl transition-transform duration-300 group-hover:scale-105" style="width:min(20rem,70vw,42dvh);height:min(20rem,70vw,42dvh)"
                onerror="this.onerror=null; this.src='logo restaurante del parque.png';"
            /></div></div>

            <!-- Prompt Text directly underneath -->
            <div class="mt-6 flex flex-col items-center">
                <span class="bg-rust hover:bg-rust-dark text-cream-light font-extrabold text-sm sm:text-base py-3 px-8 rounded-full shadow-lg transition-all duration-300 flex items-center space-x-2 tracking-wide uppercase animate-pulse">
                    <span>Toca para ingresar</span>
                    <i class="fa-solid fa-chevron-right text-xs ml-1"></i>
                </span>
            </div>

        </button>

    </main>

    <footer class="w-full px-6 pt-4 z-20 flex flex-col items-center" style="padding-bottom:max(1.5rem,env(safe-area-inset-bottom))">
        <p class="text-[11px] text-navy/50 text-center font-semibold tracking-wider uppercase">
            Restaurante del Parque © 2026
        </p>
    </footer>

    <div id="menuOverlay" class="fixed inset-0 bg-navy/95 backdrop-blur-md z-50 flex flex-col safe opacity-0 pointer-events-none transition-opacity duration-300 text-cream-light">
        <div class="flex justify-between items-center pt-2 shrink-0">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-rust flex items-center justify-center text-cream font-bold text-lg border border-cream/30">RP</div>
                <div>
                    <h3 class="font-serif font-bold text-lg text-cream">Restaurante del Parque</h3>
                    <p class="text-xs text-cream/70" id="overlaySub">Menú Digital</p>
                </div>
            </div>
            <button onclick="closeMenu()" aria-label="Cerrar" class="w-10 h-10 rounded-full bg-navy-light text-cream hover:bg-rust transition-colors flex items-center justify-center border border-cream/20">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto py-6 max-w-md w-full mx-auto" id="menuScroll">
            <button id="backBtn" onclick="goBack()" class="hidden mb-4 text-xs font-bold text-rust-light hover:text-cream items-center space-x-2">
                <i class="fa-solid fa-chevron-left"></i><span>Volver</span>
            </button>
            <div class="text-center mb-6">
                <span class="text-xs uppercase tracking-widest text-rust-light font-bold" id="viewEyebrow">¡Bienvenido/a!</span>
                <h2 class="text-2xl font-serif font-bold text-cream mt-1" id="viewTitle">¿Qué te gustaría pedir hoy?</h2>
            </div>
            <div id="viewList" class="grid grid-cols-1 gap-3"></div>
        </div>

        <div class="w-full max-w-md mx-auto pt-4 border-t border-cream/10 flex items-center justify-between shrink-0">
            <span class="text-xs text-cream/60" id="footInfo"><i class="fa-solid fa-clock text-rust-light mr-1"></i> Delivery en minutos</span>
            <button onclick="closeMenu()" class="text-xs text-rust-light font-bold underline hover:text-cream">Volver al inicio</button>
        </div>
    </div>

    <div id="flow" class="fixed inset-0 bg-navy z-[60] hidden flex-col safe text-cream-light overflow-y-auto"></div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-navy text-cream px-5 py-3 rounded-xl shadow-2xl border border-rust/40 z-[70] transition-all duration-300 opacity-0 pointer-events-none flex items-center space-x-3 max-w-xs w-full">
        <i id="toastIcon" class="fa-solid fa-circle-info text-rust-light text-lg"></i>
        <span id="toastMsg" class="text-xs font-semibold">Cargando menú...</span>
    </div>

    <script src="js/config.js" defer></script>
    <script src="js/datos-menu.js" defer></script>
    <script src="js/validaciones.js" defer></script>
    <script src="js/utilidades.js" defer></script>
    <script src="js/menu-ui.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/pedido.js" defer></script>
    <script src="js/horario.js" defer></script>

</body>
</html>
